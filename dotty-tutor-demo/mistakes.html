<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>错题复盘 · Dotty Tutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<script src="assets/data.js"></script>


</head>
<body class="min-h-screen">
<div class="flex">

    <aside class="w-60 shrink-0 border-r border-[var(--line)] bg-white/70 min-h-screen p-4 flex flex-col gap-1">
      <div class="flex items-center gap-2 px-2 pb-4 mb-2 border-b border-[var(--line)]">
        <span class="text-2xl">🦉</span>
        <div>
          <div class="font-bold display text-[15px] leading-none">Dotty Tutor</div>
          <div class="text-[11px] text-[var(--ink-soft)] mt-1">学生学习空间</div>
        </div>
      </div>
      <a href="student-home.html" class="nav-link "><span>🏠</span><span>我的首页</span></a>
<a href="practice.html" class="nav-link "><span>✏️</span><span>答题练习</span></a>
<a href="mistakes.html" class="nav-link teal-active"><span>📕</span><span>错题本</span></a>
      <a href="login.html" class="nav-link mt-auto text-[var(--ink-soft)]"><span>↩️</span><span>退出登录</span></a>
    </aside>
    
<main class="flex-1 min-h-screen">

<div class="p-8 max-w-4xl">
  <h1 class="display text-2xl font-bold mb-1">错题复盘</h1>
  <p class="text-[var(--ink-soft)] text-sm mb-6">系统会针对未攻克的错题反复推送练习，直到掌握达标</p>
  <div class="space-y-3" id="wrongList"></div>
</div>

</main>
</div>

<script>
document.getElementById('wrongList').innerHTML = DOTTY_DATA.mistakes.map(w=>`
  <div class="card p-4 flex items-start justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 mb-1.5">
        <span class="tag tag-brand">${w.type}</span>
        ${w.mastered ? '<span class="tag tag-pass">已掌握</span>' : `<span class="tag tag-pending">陪练中 · 第${w.rounds}轮</span>`}
      </div>
      <div class="text-sm font-medium">${w.stem}</div>
      <div class="text-xs text-[var(--ink-soft)] mt-1">来源：${w.source}</div>
    </div>
    ${w.mastered ? '' : '<a href="practice.html" class="btn btn-teal shrink-0 text-xs !py-1.5">再练一次</a>'}
  </div>`).join('');
</script>

</body>
</html>
