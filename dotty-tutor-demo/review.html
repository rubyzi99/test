<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 出题 & 审校 · Dotty Tutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<script src="assets/data.js"></script>


</head>
<body class="min-h-screen">
<div class="flex">

    <aside class="w-60 shrink-0 border-r border-[var(--line)] bg-white/70 min-h-screen p-4 flex flex-col gap-1">
      <div class="flex items-center gap-2 px-2 pb-4 mb-2 border-b border-[var(--line)]">
        <span class="text-2xl">🦉</span>
        <div>
          <div class="font-bold display text-[15px] leading-none">Dotty Tutor</div>
          <div class="text-[11px] text-[var(--ink-soft)] mt-1">教研工作台</div>
        </div>
      </div>
      <a href="teacher-dashboard.html" class="nav-link "><span>🏠</span><span>工作台首页</span></a>
<a href="upload.html" class="nav-link "><span>📤</span><span>教材上传</span></a>
<a href="review.html" class="nav-link active"><span>🧪</span><span>AI 出题 & 审校</span></a>
<a href="bank.html" class="nav-link "><span>📚</span><span>题库管理</span></a>
      <a href="login.html" class="nav-link mt-auto text-[var(--ink-soft)]"><span>↩️</span><span>退出登录</span></a>
    </aside>
    
<main class="flex-1 min-h-screen">

<div class="p-8 max-w-6xl">
  <h1 class="display text-2xl font-bold mb-1">AI 出题 & 双模型审校</h1>
  <p class="text-[var(--ink-soft)] text-sm mb-6">文本模型校验语义与答案正确性，视觉模型校验图文匹配；质量门禁按规则自动拦截不合格题目</p>

  <div class="flex gap-3 mb-5 text-sm">
    <div class="card px-4 py-2.5"><span class="text-[var(--ink-soft)]">共</span> <b>6</b> <span class="text-[var(--ink-soft)]">道待审</span></div>
    <div class="card px-4 py-2.5 tag-pass"><span>4 通过</span></div>
    <div class="card px-4 py-2.5 tag-fail"><span>2 拦截</span></div>
  </div>

  <div class="space-y-3" id="queueList"></div>
</div>

<div id="editDrawer" class="fixed inset-0 bg-black/30 hidden items-center justify-center z-20" style="display:none;">
  <div class="card w-full max-w-lg p-6 mx-4">
    <h3 class="font-semibold mb-3">人工编辑题目</h3>
    <div class="space-y-3">
      <div><label class="text-xs text-[var(--ink-soft)]">题干</label>
        <textarea id="editStem" class="w-full mt-1 border border-[var(--line)] rounded-lg p-2 text-sm" rows="3"></textarea></div>
      <div><label class="text-xs text-[var(--ink-soft)]">拦截原因 / 备注</label>
        <textarea id="editReason" class="w-full mt-1 border border-[var(--line)] rounded-lg p-2 text-sm" rows="2"></textarea></div>
    </div>
    <div class="flex gap-2 mt-5">
      <button class="btn btn-ghost flex-1" onclick="closeDrawer()">取消</button>
      <button class="btn btn-brand flex-1" onclick="resubmit()">修改后重新提交审校</button>
    </div>
  </div>
</div>

</main>
</div>

<script>
function renderQueue(){
  document.getElementById('queueList').innerHTML = DOTTY_DATA.reviewQueue.map(q=>{
    const passTag = q.gate==='pass' ? '<span class="tag tag-pass">✓ 门禁通过</span>' : '<span class="tag tag-fail">✕ 门禁拦截</span>';
    return `<div class="card p-4">
      <div class="flex items-start justify-between gap-4">
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-1.5">
            <span class="tag tag-brand">${q.type}</span>${passTag}
          </div>
          <div class="text-sm font-medium">${q.stem}</div>
          <div class="text-xs text-[var(--ink-soft)] mt-1">原文出处：${q.source}</div>
          ${q.reason?`<div class="text-xs text-[var(--danger)] mt-1.5">拦截理由：${q.reason}</div>`:''}
        </div>
        <div class="text-right shrink-0 w-40">
          <div class="text-xs text-[var(--ink-soft)]">文本模型 <b class="text-[var(--ink)]">${q.text}</b>/10</div>
          ${q.vision!==null?`<div class="text-xs text-[var(--ink-soft)] mt-1">视觉模型 <b class="text-[var(--ink)]">${q.vision}</b>/10</div>`:''}
          ${q.gate==='fail'?`<button class="btn btn-ghost mt-2 text-xs !py-1.5" onclick="openDrawer('${q.id}')">人工编辑</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}
renderQueue();
let editingId = null;
function openDrawer(id){
  editingId = id;
  const q = DOTTY_DATA.reviewQueue.find(x=>x.id===id);
  document.getElementById('editStem').value = q.stem;
  document.getElementById('editReason').value = q.reason || '';
  document.getElementById('editDrawer').style.display='flex';
}
function closeDrawer(){ document.getElementById('editDrawer').style.display='none'; }
function resubmit(){
  const q = DOTTY_DATA.reviewQueue.find(x=>x.id===editingId);
  q.stem = document.getElementById('editStem').value;
  q.gate = 'pass'; q.reason = null; q.text = 8.5;
  closeDrawer();
  renderQueue();
}
</script>

</body>
</html>
