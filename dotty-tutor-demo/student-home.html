<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生首页 · Dotty Tutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<script src="assets/data.js"></script>


</head>
<body class="min-h-screen">
<div class="flex">

    <aside class="w-60 shrink-0 border-r border-[var(--line)] bg-white/70 min-h-screen p-4 flex flex-col gap-1">
      <div class="flex items-center gap-2 px-2 pb-4 mb-2 border-b border-[var(--line)]">
        <span class="text-2xl">🦉</span>
        <div>
          <div class="font-bold display text-[15px] leading-none">Dotty Tutor</div>
          <div class="text-[11px] text-[var(--ink-soft)] mt-1">学生学习空间</div>
        </div>
      </div>
      <a href="student-home.html" class="nav-link teal-active"><span>🏠</span><span>我的首页</span></a>
<a href="practice.html" class="nav-link "><span>✏️</span><span>答题练习</span></a>
<a href="mistakes.html" class="nav-link "><span>📕</span><span>错题本</span></a>
      <a href="login.html" class="nav-link mt-auto text-[var(--ink-soft)]"><span>↩️</span><span>退出登录</span></a>
    </aside>
    
<main class="flex-1 min-h-screen">

<div class="p-8 max-w-5xl">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="display text-2xl font-bold">你好，<span id="stuName"></span> 👋</h1>
      <p class="text-[var(--ink-soft)] text-sm mt-1">保持连续打卡 <b id="stuStreak" class="text-[var(--teal)]"></b> 天，继续加油</p>
    </div>
    <a href="mistakes.html" class="btn btn-ghost">📕 错题本</a>
  </div>

  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="card p-4"><div class="text-xs text-[var(--ink-soft)]">已掌握词汇/知识点</div><div class="text-2xl font-bold mt-1" id="stuMastered"></div></div>
    <div class="card p-4"><div class="text-xs text-[var(--ink-soft)]">待完成练习</div><div class="text-2xl font-bold mt-1 text-[var(--amber)]" id="stuTodo"></div></div>
    <div class="card p-4"><div class="text-xs text-[var(--ink-soft)]">未攻克错题</div><div class="text-2xl font-bold mt-1 text-[var(--danger)]" id="stuWrong"></div></div>
  </div>

  <h2 class="font-semibold mb-3">练习清单</h2>
  <div class="grid grid-cols-3 gap-4" id="packList"></div>
</div>

</main>
</div>

<script>
const s = DOTTY_DATA.student;
document.getElementById('stuName').textContent = s.name;
document.getElementById('stuStreak').textContent = s.streak;
document.getElementById('stuMastered').textContent = s.mastered;
document.getElementById('stuTodo').textContent = s.toPractice;
document.getElementById('stuWrong').textContent = s.wrongOpen;
document.getElementById('packList').innerHTML = DOTTY_DATA.practicePacks.map(p=>`
  <a href="practice.html" class="card p-4 block hover:border-[var(--teal)] transition">
    <div class="text-sm font-medium mb-2">${p.name}</div>
    <div class="text-xs text-[var(--ink-soft)] mb-2">共 ${p.count} 题</div>
    <div class="progress-track"><div class="progress-fill teal" style="width:${p.progress*100}%"></div></div>
    <div class="text-xs text-[var(--ink-soft)] mt-2">${Math.round(p.progress*100)}% 已完成</div>
  </a>`).join('');
</script>

</body>
</html>
