<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题练习 · Dotty Tutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>">
<script src="assets/data.js"></script>


</head>
<body class="min-h-screen">
<div class="flex">

    <aside class="w-60 shrink-0 border-r border-[var(--line)] bg-white/70 min-h-screen p-4 flex flex-col gap-1">
      <div class="flex items-center gap-2 px-2 pb-4 mb-2 border-b border-[var(--line)]">
        <span class="text-2xl">🦉</span>
        <div>
          <div class="font-bold display text-[15px] leading-none">Dotty Tutor</div>
          <div class="text-[11px] text-[var(--ink-soft)] mt-1">学生学习空间</div>
        </div>
      </div>
      <a href="student-home.html" class="nav-link "><span>🏠</span><span>我的首页</span></a>
<a href="practice.html" class="nav-link teal-active"><span>✏️</span><span>答题练习</span></a>
<a href="mistakes.html" class="nav-link "><span>📕</span><span>错题本</span></a>
      <a href="login.html" class="nav-link mt-auto text-[var(--ink-soft)]"><span>↩️</span><span>退出登录</span></a>
    </aside>
    
<main class="flex-1 min-h-screen">

<div class="p-8 max-w-3xl">
  <div class="flex items-center justify-between mb-1">
    <h1 class="display text-2xl font-bold">答题练习</h1>
    <div class="text-sm text-[var(--ink-soft)]">第 <b id="qIndex">1</b> / <span id="qTotal"></span> 题</div>
  </div>
  <div class="progress-track mb-6"><div class="progress-fill teal" id="progBar" style="width:0%"></div></div>

  <div class="card p-6 fade-in" id="qCard"></div>

  <div class="flex items-center justify-between mt-5">
    <button id="hintBtn" class="btn btn-ghost text-sm">💡 解锁提示</button>
    <div class="flex gap-2">
      <button id="submitBtn" class="btn btn-teal">提交答案</button>
      <button id="nextBtn" class="btn btn-brand hidden">下一题 →</button>
    </div>
  </div>
  <div id="hintBox" class="mt-4 space-y-2"></div>
  <div id="resultBox" class="mt-4"></div>
</div>

</main>
</div>

<script>
const QS = DOTTY_DATA.practiceQuestions;
let qi = 0, hintLevel = 0, answered = false, dragOrder = [];
document.getElementById('qTotal').textContent = QS.length;

function renderQuestion(){
  const q = QS[qi];
  hintLevel = 0; answered = false;
  document.getElementById('qIndex').textContent = qi+1;
  document.getElementById('progBar').style.width = ((qi)/QS.length*100)+'%';
  document.getElementById('hintBox').innerHTML = '';
  document.getElementById('resultBox').innerHTML = '';
  document.getElementById('submitBtn').classList.remove('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('hintBtn').disabled = false;

  let body = `<div class="tag tag-teal mb-3 inline-block">${q.type}</div><div class="text-base font-medium mb-5">${q.stem}</div>`;

  if(q.type==='单选' || q.type==='判断'){
    body += q.options.map((o,i)=>`
      <label class="flex items-center gap-3 border border-[var(--line)] rounded-xl p-3 mb-2 cursor-pointer opt-row" data-i="${i}">
        <input type="radio" name="opt" value="${i}" class="accent-[var(--teal)]"><span class="text-sm">${o}</span>
      </label>`).join('');
  } else if(q.type==='多选'){
    body += q.options.map((o,i)=>`
      <label class="flex items-center gap-3 border border-[var(--line)] rounded-xl p-3 mb-2 cursor-pointer opt-row" data-i="${i}">
        <input type="checkbox" value="${i}" class="accent-[var(--teal)]"><span class="text-sm">${o}</span>
      </label>`).join('');
  } else if(q.type==='填空'){
    body += `<input id="fillInput" class="w-full border border-[var(--line)] rounded-lg px-3 py-2.5 text-sm" placeholder="在此输入答案">`;
  } else if(q.type==='简答'){
    body += `<textarea id="shortAnswer" rows="3" class="w-full border border-[var(--line)] rounded-lg px-3 py-2.5 text-sm" placeholder="用一两句话回答"></textarea>`;
  } else if(q.type==='匹配'){
    const left = q.pairs.map(p=>p[0]);
    const rightShuffled = q.pairs.map(p=>p[1]).sort(()=>Math.random()-0.5);
    body += `<div class="grid grid-cols-2 gap-6">
      <div class="space-y-2">${left.map(l=>`<div class="border border-[var(--line)] rounded-lg p-2.5 text-sm">${l}</div>`).join('')}</div>
      <div class="space-y-2">${rightShuffled.map((r,i)=>`<select data-idx="${i}" class="matchSel w-full border border-[var(--line)] rounded-lg p-2 text-sm"><option value="">选择释义...</option>${q.pairs.map(p=>`<option value="${p[1]}">${p[1]}</option>`).join('')}</select>`).join('')}</div>
    </div>`;
  } else if(q.type==='拖拽排序'){
    dragOrder = q.tokens.map((_,i)=>i).sort(()=>Math.random()-0.5);
    body += `<div id="dragList" class="flex flex-wrap gap-2"></div><p class="text-xs text-[var(--ink-soft)] mt-2">点击单词按顺序排列成句子</p><div id="dragAnswer" class="mt-3 flex flex-wrap gap-2 min-h-[40px] border border-dashed border-[var(--line)] rounded-lg p-2"></div>`;
  }
  document.getElementById('qCard').innerHTML = body;

  if(q.type==='拖拽排序') setupDrag(q);
}

let dragPicked = [];
function setupDrag(q){
  dragPicked = [];
  const list = document.getElementById('dragList');
  list.innerHTML = q.tokens.map((t,i)=>`<button data-i="${i}" class="dragTok px-3 py-1.5 rounded-lg border border-[var(--line)] bg-white text-sm">${t}</button>`).join('');
  list.querySelectorAll('.dragTok').forEach(btn=>btn.addEventListener('click', ()=>{
    if(btn.disabled) return;
    btn.disabled = true; btn.classList.add('opacity-30');
    dragPicked.push(parseInt(btn.dataset.i));
    document.getElementById('dragAnswer').innerHTML = dragPicked.map(i=>`<span class="px-3 py-1.5 rounded-lg bg-[var(--teal-soft)] text-[var(--teal)] text-sm font-medium">${q.tokens[i]}</span>`).join('');
  }));
}

document.getElementById('hintBtn').addEventListener('click', ()=>{
  const q = QS[qi];
  if(hintLevel >= q.hints.length){ return; }
  const box = document.getElementById('hintBox');
  box.innerHTML += `<div class="text-sm bg-[var(--amber-soft)] text-[var(--amber)] rounded-lg p-3 fade-in">${q.hints[hintLevel]}</div>`;
  hintLevel++;
  if(hintLevel >= q.hints.length) document.getElementById('hintBtn').disabled = true;
});

function checkAnswer(q){
  if(q.type==='单选' || q.type==='判断'){
    const sel = document.querySelector('input[name=opt]:checked');
    return sel && parseInt(sel.value) === q.answer;
  }
  if(q.type==='多选'){
    const picked = [...document.querySelectorAll('#qCard input[type=checkbox]:checked')].map(c=>parseInt(c.value)).sort();
    const correct = [...q.answers].sort();
    return JSON.stringify(picked)===JSON.stringify(correct);
  }
  if(q.type==='填空'){
    const v = (document.getElementById('fillInput').value||'').trim().toLowerCase();
    return v === q.answer.toLowerCase();
  }
  if(q.type==='简答'){
    return document.getElementById('shortAnswer').value.trim().length > 3; // AI-assisted scoring mocked as pass
  }
  if(q.type==='匹配'){
    const sels = [...document.querySelectorAll('.matchSel')];
    return sels.every(s=>s.value !== '') && true; // simplified mock check
  }
  if(q.type==='拖拽排序'){
    return JSON.stringify(dragPicked) === JSON.stringify(q.correctOrder);
  }
  return false;
}

document.getElementById('submitBtn').addEventListener('click', ()=>{
  if(answered) return;
  const q = QS[qi];
  const ok = checkAnswer(q);
  answered = true;
  document.getElementById('resultBox').innerHTML = ok
    ? `<div class="text-sm bg-[var(--success-soft)] text-[var(--success)] rounded-lg p-3 fade-in">✅ 回答正确！${q.hints[q.hints.length-1]}</div>`
    : `<div class="text-sm bg-[var(--danger-soft)] text-[var(--danger)] rounded-lg p-3 fade-in">❌ 回答有误，已自动加入错题本。${q.hints[q.hints.length-1]}</div>`;
  document.getElementById('submitBtn').classList.add('hidden');
  document.getElementById('nextBtn').classList.remove('hidden');
  document.getElementById('hintBtn').disabled = true;
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  qi = (qi+1) % QS.length;
  renderQuestion();
});

renderQuestion();
</script>

</body>
</html>
